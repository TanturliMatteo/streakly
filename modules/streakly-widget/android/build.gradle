plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.streaklywidget'
version = '1.0.0'

android {
  namespace "expo.modules.streaklywidget"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // HabitRulesCasesTest (JVM unit test, same versions as expo-modules-core).
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20250517'
}
